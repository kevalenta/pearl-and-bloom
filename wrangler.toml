name = "pearlandbloom"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The static site (index.html, style.css, app.js, img/) lives in public/.
# Requests for real files are served straight from there; anything else
# (like /api/order) goes to the Worker in src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Orders database (Cloudflare D1 = SQLite). Schema lives in migrations/.
[[d1_databases]]
binding = "DB"
database_name = "pearl-and-bloom"
database_id = "935a5419-243a-4340-b84c-9c654b322a0b"

# Email is sent through Microsoft 365 (Graph API) as orders@pearlandbloom.us.
# Secrets (set in the Cloudflare dashboard → Worker → Settings → Variables, never in git):
#   MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET
[vars]
SHOP_FROM = "orders@pearlandbloom.us"
SHOP_NAME = "Pearl & Bloom"
VENMO_HANDLE = ""
