name = "pearlandbloom"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The static site (index.html, style.css, app.js, img/) lives in public/.
# Requests for real files are served straight from there; anything else
# (like /api/order) goes to the Worker in src/index.js.
[assets]
directory = "./public"
binding = "ASSETS"

# Orders database (Cloudflare D1 = SQLite). Schema lives in migrations/.
[[d1_databases]]
binding = "DB"
database_name = "pearl-and-bloom"
database_id = "935a5419-243a-4340-b84c-9c654b322a0b"

# Product photos uploaded from the admin page (Cloudflare R2, free tier).
# Create the bucket once in the dashboard: R2 → Create bucket → "pearl-and-bloom-photos".
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "pearl-and-bloom-photos"

# Email is sent through Microsoft 365 (Graph API) as orders@pearlandbloom.us.
# Secrets (set in the Cloudflare dashboard → Worker → Settings → Variables, never in git):
#   MS_CLIENT_SECRET   (Microsoft Graph app secret)
#   ADMIN_TOKEN        (long random string; the admin app on the pearlbloom VM sends it)
[vars]
SHOP_FROM = "orders@pearlandbloom.us"
SHOP_NAME = "Pearl & Bloom"
VENMO_HANDLE = "@Melissa-Valenta-1"
MS_TENANT_ID = "72c2ab32-2a98-491b-8b3a-dbe01d059eaf"
MS_CLIENT_ID = "da69682b-520e-44ef-a2d8-6d5291f36a2b"
